[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqn-meent"
version = "0.1.0"
description = "A reusable user–LLM research harness for developing optimizers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.3",
  "threadpoolctl>=3.6,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "jsonschema>=4.19,<5",
  "langgraph>=1,<2",
  "packaging>=24,<27",
  "pypdf>=6.19,<7",
  "tensorboard>=2.20,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "jsonschema>=4.19,<5"]
meent = ["meent==0.13.2", "scipy==1.18.1", "matplotlib>=3.10,<4", "tqdm>=4.70,<5"]
learners = ["torch==2.14.0", "gymnasium==1.3.0"]

[project.scripts]
dqn-meent = "dqn_meent.cli:main"
grating-lab = "dqn_meent.workspace.api:main"
grating-implementations = "dqn_meent.implementations.api:main"
optimization-lab = "optimization_framework.api.app:main"
optimization-implementations = "optimization_framework.implementations.api:main"
optimization-research = "optimization_framework.cli:main"
optimization-report = "optimization_framework.reports.cli:main"

[project.entry-points."optimization_framework.problems"]
meent_grating = "dqn_meent.problem:MeentProblem"
meent_2d_dual_polarization_deflector = "dqn_meent.problem_2d:Meent2DProblem"
bounded_continuous = "optimization_benchmarks.problems:ContinuousProblem"

[tool.hatch.build.targets.wheel]
packages = ["src/dqn_meent", "src/optimization_framework", "src/optimization_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
