[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balsamic"
version = "0.3.0"
description = "Balsamic: a chat-centred research workspace for developing optimizers with a lead agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.3",
  "threadpoolctl>=3.6,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "jsonschema>=4.19,<5",
  "packaging>=24,<27",
  "pypdf>=6.19,<7",
  "tensorboard>=2.20,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "jsonschema>=4.19,<5"]
# MEENT is the meent-private fork (feature/cuda-acceleration): Torch-only, on CPU or CUDA.
meent = ["meent==0.13.2", "torch==2.14.0", "scipy==1.18.1", "matplotlib>=3.10,<4", "tqdm>=4.70,<5"]
learners = ["torch==2.14.0", "gymnasium==1.3.0"]
masks = ["mask-optimizers==0.1.0"]

[project.scripts]
dqn-meent = "dqn_meent.cli:main"
balsamic = "balsamic.app:main"
optimization-lab = "balsamic.app:main"
optimization-implementations = "optimization_framework.implementations.api:main"
optimization-research = "optimization_framework.cli:main"
optimization-report = "optimization_framework.reports.cli:main"

[project.entry-points."optimization_framework.problems"]
meent_grating = "dqn_meent.problem:MeentProblem"
meent_2d_dual_polarization_deflector = "dqn_meent.problem_2d:Meent2DProblem"
bounded_continuous = "optimization_benchmarks.problems:ContinuousProblem"

[project.entry-points."optimization_framework.optimizers"]
mask_optimizers = "dqn_meent.mask_library_adapter:MaskLibraryPlugin"

[tool.uv.sources]
meent = { git = "https://github.com/HoseungChoi51/meent-private", branch = "feature/cuda-acceleration" }
mask-optimizers = { git = "https://github.com/kc-ml2/mask-optimizers", tag = "v0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/balsamic", "src/dqn_meent", "src/optimization_framework", "src/optimization_benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
